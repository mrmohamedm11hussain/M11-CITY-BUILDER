<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101b2d">

  <title>M11 CITY BUILDER</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="game">
    <div id="loading">
      <div class="loader"></div>
      <h2>M11 CITY BUILDER</h2>
      <p>جاري تجهيز مدينتك...</p>
    </div>

    <div id="hud" class="hidden">
      <header class="top-bar">
        <div class="brand">
          <span class="brand-icon">🏙️</span>
          <div>
            <h1>M11 CITY</h1>
            <small>ابنِ مدينتك</small>
          </div>
        </div>

        <div class="money-box">
          <span>💰</span>
          <strong id="money">5000</strong>
        </div>
      </header>

      <div class="city-stats">
        <div class="stat">
          <span>🏠</span>
          <div>
            <small>السكان</small>
            <strong id="population">0</strong>
          </div>
        </div>

        <div class="stat">
          <span>🏗️</span>
          <div>
            <small>المباني</small>
            <strong id="buildings">0</strong>
          </div>
        </div>

        <div class="stat">
          <span>📈</span>
          <div>
            <small>الدخل</small>
            <strong id="income">0</strong>
          </div>
        </div>
      </div>

      <div class="right-tools">
        <button id="cameraBtn" class="tool-btn" aria-label="تدوير الكاميرا">🔄</button>
        <button id="zoomInBtn" class="tool-btn" aria-label="تكبير">＋</button>
        <button id="zoomOutBtn" class="tool-btn" aria-label="تصغير">－</button>
      </div>

      <div class="build-panel">
        <div class="panel-heading">
          <div>
            <h2>🏗️ بناء المدينة</h2>
            <p>اختار المبنى واضغط على الأرض</p>
          </div>
          <button id="cancelBuild" class="cancel-btn">✕</button>
        </div>

        <div class="build-options">
          <button class="build-btn" data-type="house">
            <span class="building-icon">🏠</span>
            <span>منزل</span>
            <small>500 💰</small>
          </button>

          <button class="build-btn" data-type="shop">
            <span class="building-icon">🏪</span>
            <span>متجر</span>
            <small>900 💰</small>
          </button>

          <button class="build-btn" data-type="road">
            <span class="building-icon">🛣️</span>
            <span>طريق</span>
            <small>100 💰</small>
          </button>

          <button class="build-btn" data-type="tree">
            <span class="building-icon">🌳</span>
            <span>شجرة</span>
            <small>150 💰</small>
          </button>
        </div>
      </div>

      <div id="toast" class="toast"></div>

      <div class="version">M11 • CITY BUILDER</div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
